<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Window｜乾淨視窗</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header><img src="icons/icon48.png" width="34" height="34" alt=""><div><h1>乾淨視窗</h1><p>CLEAN WINDOW</p></div><span class="version">0.1</span></header>
  <main>
    <div class="scope"><span class="dot"></span><span id="target-status">正在確認目標視窗…</span></div>
    <section class="level-picker" aria-label="簡化等級">
      <div class="level-heading"><label for="clean-level">簡化程度</label><output id="level-number" for="clean-level">1 / 3</output></div>
      <input id="clean-level" type="range" min="1" max="3" step="1" value="1" disabled aria-describedby="level-title level-limit">
      <div class="steps" aria-hidden="true"><span>1</span><span>2</span><span>3</span></div>
      <div class="level-preview">
        <strong id="level-title">1 · 自繪網址欄＋擴充欄</strong>
        <p id="level-detail">精簡 Popup 加上自繪網址欄與 Clean Window 專屬擴充工具列。</p>
        <p id="level-limit" class="limit"></p>
      </div>
    </section>
    <button type="button" class="choice primary" data-action="toggle-clean" disabled>
      <span class="button-title" id="clean-label">套用此簡化等級</span>
      <span class="description" id="clean-description">將目前分頁移至選擇的視窗模式。</span>
      <kbd>Alt + Shift + W</kbd>
    </button>
    <button type="button" id="restore" data-action="restore" disabled><span>還原目前視窗</span><kbd>Alt + Shift + R</kbd></button>
    <p id="feedback" role="status" aria-live="polite" hidden></p>
    <p class="note">三級模式皆使用可縮放 Popup。標題預設為 ◈＋原始頁名；按 Alt+Shift+T 或使用頁面右鍵選單編輯 Symbol 與文字。自繪網址欄並非 Chrome 原生安全介面。</p>
  </main>
  <footer><span>本機處理 · 不傳送頁面內容</span><span>僅影響指定視窗</span></footer>
</body>
</html>
